name: OpenBao S5.6B Acceptance

on:
  push:
    branches:
      - main
      - "licensing/s5-6b-openbao-transit-v0.1"
  pull_request:
    paths:
      - "issuer-openbao-transit/**"
      - "scripts/run-live-openbao-transit-acceptance.sh"
      - ".github/workflows/openbao-s5-6b-acceptance.yml"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  cross-repo-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Licensing Service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout frozen LiliyaCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yaroshenkopavel/LiliyaCore-
          ref: 5a4f0c82a64eec11230bdd5afc322d647071f90a
          path: liliya-core

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.6.1"

      - name: Set up Android SDK for frozen LiliyaCore configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run free OpenBao Transit cross-repository acceptance
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-live-openbao-transit-acceptance.sh "$GITHUB_WORKSPACE/liliya-core"             2>&1 | tee openbao-s5-6b-acceptance.log

          grep -F 'LICENSING_S5_6B_OPENBAO_EVIDENCE='             openbao-s5-6b-acceptance.log
          grep -F 'LICENSING_S5_7_CROSS_REPO_EVIDENCE='             openbao-s5-6b-acceptance.log
          grep -F '=== LIVE OPENBAO TRANSIT ACCEPTANCE PASS ==='             openbao-s5-6b-acceptance.log
