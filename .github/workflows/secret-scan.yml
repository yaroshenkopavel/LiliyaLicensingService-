name: Secret Guard

on:
  push:
    branches:
      - main
      - "licensing/**"
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private-key material and obvious production secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' \) -print -quit | grep -q .; then
            echo "Forbidden secret/key file present"
            exit 1
          fi
          if grep -R -n --exclude-dir=.git -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' .; then
            echo "Forbidden private-key or credential pattern present"
            exit 1
          fi
