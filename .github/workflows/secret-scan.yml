name: Secret Guard

on:
  push:
    branches:
      - main
      - "licensing/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject secret/key files in current tree
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \
            \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
               -o -name '*.jks' -o -name '*.keystore' -o -name '*.der' \) \
            -print -quit | grep -q .; then
            echo "Forbidden secret/key file present in current tree"
            exit 1
          fi

      - name: Scan current tree for high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail

          PATTERN='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|sk_live_[0-9A-Za-z]{16,}'

          if grep -R -I -n \
            --exclude-dir=.git \
            --exclude='secret-scan.yml' \
            -E "$PATTERN" .; then
            echo "Forbidden high-confidence credential pattern present"
            exit 1
          fi

      - name: Scan all reachable Git history for secret files and credentials
        shell: bash
        run: |
          set -euo pipefail

          PATTERN='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|sk_live_[0-9A-Za-z]{16,}'

          bad=0

          while read -r commit; do
            if git ls-tree -r --name-only "$commit" | \
              grep -E '\.(pem|key|p12|pfx|jks|keystore|der)$' >/tmp/secret-files.txt; then
              echo "Forbidden secret/key file exists in history at $commit"
              cat /tmp/secret-files.txt
              bad=1
            fi

            if git grep -I -n -E "$PATTERN" "$commit" -- . \
              ':(exclude).github/workflows/secret-scan.yml' \
              >/tmp/secret-patterns.txt 2>/dev/null; then
              echo "Forbidden high-confidence credential pattern exists in history at $commit"
              cat /tmp/secret-patterns.txt
              bad=1
            fi
          done < <(git rev-list --all)

          if [[ "$bad" -ne 0 ]]; then
            echo "Historical secret scan failed"
            exit 1
          fi

          echo "Full reachable Git history secret scan: CLEAN"

      - name: Public-repository workflow safety guard
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E '^\s*pull_request_target\s*:' .github/workflows; then
            echo "pull_request_target is forbidden without a dedicated security review"
            exit 1
          fi

          if grep -R -n -E '^\s*permissions:\s*write-all\s*$' .github/workflows; then
            echo "write-all workflow permission is forbidden"
            exit 1
          fi

          echo "Public workflow trigger/permission guard: CLEAN"
