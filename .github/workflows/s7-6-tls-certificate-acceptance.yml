name: S7.6 TLS Certificate Acceptance

on:
  push:
    branches:
      - main
      - "licensing/s7-6-https-listener-v0.1"
  pull_request:
    paths:
      - "issuer-https-listener/**"
      - "scripts/run-s7-6-tls-certificate-acceptance.sh"
      - ".github/workflows/s7-6-tls-certificate-acceptance.yml"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  tls-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Licensing Service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.6.1"

      - name: Run HTTPS certificate lifecycle acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/run-s7-6-tls-certificate-acceptance.sh 2>&1 | tee s7-6-tls.log
          grep -F 'LICENSING_S7_6_TLS_EVIDENCE=' s7-6-tls.log
          grep -F '=== S7.6 TLS CERTIFICATE ACCEPTANCE PASS ===' s7-6-tls.log
