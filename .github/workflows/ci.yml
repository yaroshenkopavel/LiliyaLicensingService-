name: Backend CI

on:
  push:
    branches:
      - main
      - "licensing/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: liliya_licensing_test
          POSTGRES_USER: liliya
          POSTGRES_PASSWORD: liliya-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liliya -d liliya_licensing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/liliya_licensing_test
      TEST_POSTGRES_USER: liliya
      TEST_POSTGRES_PASSWORD: liliya-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Test
        run: gradle --no-daemon clean check
      - name: Architecture guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'android\.|com\.android|onnx|llama\.cpp|RuntimeHardening'             --include='*.kt' --include='*.kts' issuer-core issuer-testkit issuer-postgres; then
            echo "Forbidden client/runtime dependency found"
            exit 1
          fi
          if grep -R -n -E '\b(Authority|ExecutionPermission|RuntimeAuthority)\b'             --include='*.kt' issuer-core/src/main; then
            echo "Forbidden Authority/Execution semantic found in backend protocol"
            exit 1
          fi
