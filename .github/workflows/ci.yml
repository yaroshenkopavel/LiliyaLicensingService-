name: Backend CI

on:
  push:
    branches:
      - main
      - "licensing/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: liliya_licensing_test
          POSTGRES_USER: liliya
          POSTGRES_PASSWORD: liliya-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liliya -d liliya_licensing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/liliya_licensing_test
      TEST_POSTGRES_USER: liliya
      TEST_POSTGRES_PASSWORD: liliya-test
      TEST_OPENBAO_ADDR: http://127.0.0.1:18200
      TEST_OPENBAO_TOKEN: ci-openbao-only-token
      TEST_OPENBAO_KEY: license-signing-ci
      TEST_OPENBAO_KEY_VERSION: "2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Start OpenBao Transit integration fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run -d             --name liliya-openbao-ci             -p 18200:8200             openbao/openbao:2.6.2             server -dev             -dev-listen-address=0.0.0.0:8200             -dev-root-token-id="$TEST_OPENBAO_TOKEN"

          for i in $(seq 1 60); do
            if curl -fsS "$TEST_OPENBAO_ADDR/v1/sys/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS "$TEST_OPENBAO_ADDR/v1/sys/health" >/dev/null

          curl -fsS             -H "X-Vault-Token: $TEST_OPENBAO_TOKEN"             -H "Content-Type: application/json"             -X POST             -d '{"type":"transit"}'             "$TEST_OPENBAO_ADDR/v1/sys/mounts/transit"             >/dev/null

          curl -fsS             -H "X-Vault-Token: $TEST_OPENBAO_TOKEN"             -H "Content-Type: application/json"             -X POST             -d '{"type":"ecdsa-p256","exportable":false,"allow_plaintext_backup":false}'             "$TEST_OPENBAO_ADDR/v1/transit/keys/$TEST_OPENBAO_KEY"             >/dev/null

          curl -fsS             -H "X-Vault-Token: $TEST_OPENBAO_TOKEN"             -H "Content-Type: application/json"             -X POST             -d '{}'             "$TEST_OPENBAO_ADDR/v1/transit/keys/$TEST_OPENBAO_KEY/rotate"             >/dev/null

      - name: Test and build deployment distribution
        run: gradle --no-daemon clean check :issuer-deployment:installDist
      - name: Architecture guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'android\.|com\.android|onnx|llama\.cpp|RuntimeHardening'             --include='*.kt' --include='*.kts'             issuer-core issuer-testkit issuer-postgres issuer-openbao-transit issuer-transport-contract issuer-http-endpoint issuer-runtime issuer-request-auth issuer-deployment issuer-https-listener; then
            echo "Forbidden client/runtime dependency found"
            exit 1
          fi
          if grep -R -n -E '\b(Authority|ExecutionPermission|RuntimeAuthority)\b'             --include='*.kt' issuer-core/src/main issuer-transport-contract/src/main issuer-http-endpoint/src/main; then
            echo "Forbidden Authority/Execution semantic found in backend protocol/transport"
            exit 1
          fi
