name: Backend CI

on:
  push:
    branches:
      - main
      - "licensing/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Test
        run: gradle --no-daemon clean check
      - name: Architecture guard
        run: |
          set -euo pipefail
          ! grep -R -n -E 'android\.|com\.android|onnx|llama\.cpp|RuntimeHardening'             --include='*.kt' --include='*.kts' issuer-core issuer-testkit
          ! grep -R -n -E '\b(Authority|ExecutionPermission|RuntimeAuthority)\b'             --include='*.kt' issuer-core/src/main || true
